<?xml version="1.0" encoding="UTF-8"?>
<!-- Thirties: a hand-hewn sandstone sundial. GNOME app icon, 128×128. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="top" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f0e4d4"/><stop offset="1" stop-color="#d4b596"/>
    </linearGradient>
    <linearGradient id="gnomon" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cba47f"/><stop offset="1" stop-color="#bb8a5e"/>
    </linearGradient>
    <clipPath id="face"><path d="M14.0 58.0 L20.0 44.0 L36.0 34.0 L58.0 30.0 L80.0 31.0 L99.0 38.0 L112.0 52.0 L114.0 66.0 L104.0 80.0 L84.0 89.0 L60.0 91.0 L36.0 86.0 L20.0 76.0 Z"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <!-- the slab: its hewn sides (shaded by the sun), then its top -->
    <path d="M14.0 71.0 L20.0 57.0 L36.0 47.0 L58.0 43.0 L80.0 44.0 L99.0 51.0 L112.0 65.0 L114.0 79.0 L104.0 93.0 L84.0 102.0 L60.0 104.0 L36.0 99.0 L20.0 89.0 Z" fill="#7a5434"/>
    <path d="M14.0 58.0 L20.0 44.0 L20.0 57.0 L14.0 71.0 Z" fill="#89603e"/><path d="M99.0 38.0 L112.0 52.0 L112.0 65.0 L99.0 51.0 Z" fill="#b5835a"/><path d="M112.0 52.0 L114.0 66.0 L114.0 79.0 L112.0 65.0 Z" fill="#ae7d55"/><path d="M114.0 66.0 L104.0 80.0 L104.0 93.0 L114.0 79.0 Z" fill="#936844"/><path d="M104.0 80.0 L84.0 89.0 L84.0 102.0 L104.0 93.0 Z" fill="#89603e"/><path d="M84.0 89.0 L60.0 91.0 L60.0 104.0 L84.0 102.0 Z" fill="#89603e"/><path d="M60.0 91.0 L36.0 86.0 L36.0 99.0 L60.0 104.0 Z" fill="#89603e"/><path d="M36.0 86.0 L20.0 76.0 L20.0 89.0 L36.0 99.0 Z" fill="#89603e"/><path d="M20.0 76.0 L14.0 58.0 L14.0 71.0 L20.0 89.0 Z" fill="#89603e"/>
    <path d="M14.0 58.0 L20.0 44.0 L36.0 34.0 L58.0 30.0 L80.0 31.0 L99.0 38.0 L112.0 52.0 L114.0 66.0 L104.0 80.0 L84.0 89.0 L60.0 91.0 L36.0 86.0 L20.0 76.0 Z" fill="url(#top)"/>
    <path d="M28.0 58.6 L32.3 48.8 L43.8 41.8 L59.7 39.0 L75.5 39.7 L89.2 44.6 L98.6 54.4 L100.0 64.2 L92.8 74.0 L78.4 80.3 L61.1 81.7 L43.8 78.2 L32.3 71.2 Z" fill="#7a5434" opacity="0.10"/>
    <path d="M36 86 L20 76 L14 58 L20 44 L36 34 L58 30 L80 31 L99 38" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>
    <ellipse cx="99.7" cy="67.7" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="80.0" cy="80.4" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="51.0" cy="81.1" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="29.5" cy="69.5" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="28.3" cy="52.3" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="48.0" cy="39.6" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="77.0" cy="38.9" rx="2.6" ry="1.8" fill="#9a6c45"/><ellipse cx="98.5" cy="50.5" rx="2.6" ry="1.8" fill="#9a6c45"/>
    <!-- the gnomon's shadow: from its base, to where its tip's shadow lands -->
    <g clip-path="url(#face)">
      <path d="M55.0 64.0 L91.0 63.0 L29.8 82.0 Z" fill="#3d2a1c" opacity="0.30"/>
    </g>
    <!-- the gnomon: a stone blade standing on that same base line -->
    <path d="M55.0 64.0 L51.0 65.2 L52.5 23.0 L56.5 19.0 Z" fill="#86603d"/>
    <path d="M55.0 64.0 L56.5 19.0 L91.0 63.0 Z" fill="url(#gnomon)"/>
    <path d="M56.5 19.0 L91.0 63.0" stroke="#e9d4bb" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M51.0 65.2 L55.0 64.0 L91.0 63.0" stroke="#5c3f27" stroke-width="1" stroke-opacity="0.5" fill="none"/>
  </g>
</svg>
