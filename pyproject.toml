[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thirties"
version = "0.1.0"
description = "Diurnal planning and 30-minute interval task budgeting application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "pygobject",
    "litert-lm-api",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thirties_core*"]
