name: Flatpak CI & Packaging

# Build and test only. Releases are published by hand, with bundles that have been audited.

on:
  push:
    branches: [ main, "feature/**", "restructure/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the oldest pyproject.toml allows. 3.13: the GNOME 50 runtime's Python (the Flatpak job runs it too).
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The core is pure Python with no dependencies to install; the GTK tests skip here (no GTK, no display)
      # and run in gui-test below.
      - name: Run Test Suite
        run: python3 -m unittest discover tests

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    # Not blocking yet: ruff's real-error rules still find one undefined name (thirty_ceil in
    # thirties_core/assistant_tools.py), and mypy's full report is mostly mixin noise. Make ruff blocking once
    # it's clean.
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff and mypy
        run: python3 -m pip install ruff==0.14.5 mypy==1.18.2

      # Real errors only: syntax errors, undefined names, comparisons that are always wrong.
      - name: Ruff (real errors)
        run: ruff check --no-cache --output-format=github --select E9,F63,F7,F82 .

      # A report, not a gate: the settings are in pyproject.toml ([tool.mypy]).
      - name: Mypy (thirties_core)
        run: mypy || true

  gui-test:
    name: Run Unit Tests with GTK (virtual display)
    runs-on: ubuntu-latest
    # Fedora: Ubuntu's libadwaita is too old for the widgets the app uses (Adw.Spinner needs 1.6).
    container:
      image: fedora:44
    steps:
      - name: Install GTK 4, libadwaita, PyGObject, Xvfb and a session bus
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-gobject gobject-introspection gtk4 libadwaita xorg-x11-server-Xvfb dbus-daemon \
            dejavu-sans-fonts git

      - name: Checkout Code
        uses: actions/checkout@v4

      # Every test, the GTK ones included, in the same private headless session as on a developer's machine
      # (tests/headless.py: its own runtime dir, session bus and Xvfb display; cairo rendering needs no GPU).
      - name: Run Test Suite in a private headless session
        run: |
          # The GTK tests skip quietly when GTK can't start; here that's a failure, not a pass.
          python3 tests/headless.py -c "import sys, tests.test_gui as t; sys.exit(0 if t.GTK else 'GTK did not start')"
          python3 tests/headless.py
        shell: bash

  flatpak-builder:
    name: Build Flatpak Bundle
    needs: [test, gui-test]
    runs-on: ubuntu-latest
    container:
      # The image for the manifest's runtime (org.gnome.Platform 50).
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The GNOME SDK fills the runner's disk; the bundle export then fails at ostree's 3% free-space floor.
      # The host's tool cache (/__t: Python, Go, Node, CodeQL...) isn't used by this container job.
      - name: Free Disk Space
        run: |
          df -h /__w
          rm -rf /__t/* || true
          df -h /__w

      - name: Build Application
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tech.redfoxlabs.Thirties.flatpak
          manifest-path: tech.redfoxlabs.Thirties.json
          cache-key: flatpak-builder-${{ github.sha }}
          # Runs the app module's test-commands (tech.redfoxlabs.Thirties.json) inside the build, on the GNOME 50
          # runtime with what ships: its Python, PyGObject, the bundled EDS and LiteRT-LM. The installed core is
          # checked against the source first. The GTK tests skip there (no private headless session); gui-test
          # runs them.
          run-tests: true

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech.redfoxlabs.Thirties.flatpak
          path: tech.redfoxlabs.Thirties.flatpak
          if-no-files-found: error
          retention-days: 14
