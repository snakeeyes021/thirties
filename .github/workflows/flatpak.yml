name: Flatpak CI & Packaging

# Build and test only. Releases are published by hand, with bundles that have been audited.

on:
  push:
    branches: [ main, "feature/**", "restructure/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the GNOME 50 runtime's Python

      # The core is pure Python with no dependencies to install; the GTK tests skip without a display.
      - name: Run Test Suite
        run: python3 -m unittest discover tests

  flatpak-builder:
    name: Build Flatpak Bundle
    needs: test
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-nightly
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The GNOME SDK fills the runner's disk; the bundle export then fails at ostree's 3% free-space floor.
      # The host's tool cache (/__t: Python, Go, Node, CodeQL...) isn't used by this container job.
      - name: Free Disk Space
        run: |
          df -h /__w
          rm -rf /__t/* || true
          df -h /__w

      - name: Build Application
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tech.redfoxlabs.Thirties.flatpak
          manifest-path: tech.redfoxlabs.Thirties.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech.redfoxlabs.Thirties.flatpak
          path: tech.redfoxlabs.Thirties.flatpak
          if-no-files-found: error
          retention-days: 14
