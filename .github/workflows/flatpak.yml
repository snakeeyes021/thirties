name: Flatpak CI & Packaging

on:
  push:
    branches: [ main, "feature/**", "restructure/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the GNOME 50 runtime's Python

      # The core is pure Python with no dependencies to install; the GTK tests skip here (no GTK, no display)
      # and run in gui-test below.
      - name: Run Test Suite
        run: python3 -m unittest discover tests

  gui-test:
    name: Run Unit Tests with GTK (virtual display)
    runs-on: ubuntu-latest
    # Fedora: Ubuntu's libadwaita is too old for the widgets the app uses (Adw.Spinner needs 1.6).
    container:
      image: fedora:44
    steps:
      - name: Install GTK 4, libadwaita, PyGObject and Xvfb
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-gobject gobject-introspection gtk4 libadwaita xorg-x11-server-Xvfb dejavu-sans-fonts git

      - name: Checkout Code
        uses: actions/checkout@v4

      # Every test, the GTK ones included: Xvfb gives them a display; cairo rendering needs no GPU.
      - name: Run Test Suite under Xvfb
        env:
          DISPLAY: ":99"
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: "1"
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          for i in $(seq 1 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          # The GTK tests skip quietly when GTK can't start; here that's a failure, not a pass.
          python3 -c "import sys, tests.test_gui as t; sys.exit(0 if t.GTK else 'GTK did not start under Xvfb')"
          python3 -m unittest discover tests
        shell: bash

  flatpak-builder:
    name: Build Flatpak Bundle
    needs: [test, gui-test]
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-nightly
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tech.redfoxlabs.Thirties.flatpak
          manifest-path: tech.redfoxlabs.Thirties.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech.redfoxlabs.Thirties.flatpak
          path: tech.redfoxlabs.Thirties.flatpak
          if-no-files-found: error
          retention-days: 14

      - name: Export OCI Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "Exporting Flatpak OCI image..."
          flatpak build-bundle --oci repo tech.redfoxlabs.Thirties.oci tech.redfoxlabs.Thirties

      - name: Upload OCI Image Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: tech.redfoxlabs.Thirties.oci
          path: tech.redfoxlabs.Thirties.oci
          if-no-files-found: error
          retention-days: 7

  publish-oci:
    name: Publish OCI Image to GHCR
    needs: flatpak-builder
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download OCI Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: tech.redfoxlabs.Thirties.oci
          path: tech.redfoxlabs.Thirties.oci

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Publish to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login -u "${{ github.actor }}" --password-stdin ghcr.io
          IMAGE_TAG="latest"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/v}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Publishing OCI image tag: ${IMAGE_TAG}"
          skopeo copy oci:tech.redfoxlabs.Thirties.oci "docker://ghcr.io/${OWNER}/thirties:${IMAGE_TAG}"
          if [[ "${IMAGE_TAG}" != "latest" ]]; then
            skopeo copy oci:tech.redfoxlabs.Thirties.oci "docker://ghcr.io/${OWNER}/thirties:latest" || true
          fi

  release:
    name: Publish GitHub Release
    needs: flatpak-builder
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Flatpak Bundle
        uses: actions/download-artifact@v4
        with:
          name: tech.redfoxlabs.Thirties.flatpak
          path: ./

      - name: Create GitHub Release and Attach Bundle
        uses: softprops/action-gh-release@v2
        with:
          files: tech.redfoxlabs.Thirties.flatpak
          generate_release_notes: true
          name: ${{ github.ref_name }}${{ startsWith(github.ref, 'refs/tags/v0.') && ' (alpha)' || '' }}
          prerelease: false  # alpha is in the name: a pre-release is never "Latest", so the newest would be hidden
          make_latest: true
